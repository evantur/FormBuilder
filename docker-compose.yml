version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: forms_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: forms_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: forms_backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: forms_db
      DB_SSLMODE: disable
      PORT: 8080
      GIN_MODE: debug
      JWT_SECRET: dev-secret-key-change-in-production
      JWT_EXPIRY_HOURS: 24
    ports:
      - "8080:8080"

volumes:
  postgres_data:
